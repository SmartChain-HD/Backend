spring:
  application:
    name: platform
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  port: 8080

---
# ========================================
# 로컬 개발 환경
# ========================================
spring:
  profiles:
    active: local
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/smartchain
    username: esg
    password: esg1234
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
  open-in-view: false

# Swagger 설정
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

# JWT 설정
jwt:
  secret: smartchainPlatformSecretKeyForJwtTokenGenerationMustBe256BitsLongNiceDay
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# 로깅 설정
logging:
  level:
    com.smartchain.platform: DEBUG
    org.hibernate.SQL: DEBUG

# reCAPTCHA v3 설정
recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:6LcC-V8sAAAAAHpYoUj5q31vQh9hDduj-4m7hvGc}
  score-threshold: ${RECAPTCHA_SCORE_THRESHOLD:0.5}
  enabled: ${RECAPTCHA_ENABLED:false}

# 파일 저장소 설정 (로컬)
file:
  storage:
    local:
      base-path: ./uploads

# AI 관련 설정들 (로컬 기준)
ai:
  run-api:
    url: http://127.0.0.1:8000
    timeout-seconds: 180
    max-retry: 3
  chat:
    base-url: http://127.0.0.1:8001
    admin-api-key: ${AI_CHAT_ADMIN_KEY:test-key}
    timeout-seconds: 30

---
# ========================================
# 운영/개발 서버 환경 (Azure 통합)
# ========================================
spring:
  config:
    activate:
      on-profile: prod, dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: ${AZURE_STORAGE_CONTAINER:smartchain-files}

logging:
  level:
    com.smartchain.platform: INFO

ai:
  chat:
    base-url: ${AI_CHAT_URL:http://127.0.0.1:8001}
    admin-api-key: ${AI_CHAT_ADMIN_KEY}