spring:
  application:
    name: platform
server:
  port: 8080
---
# ========================================
# 로컬 개발 환경
# ========================================
spring:
  profiles:
    active: local
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/smartchain
    username: esg
    password: esg1234
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# Swagger 설정
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

# JWT 설정
jwt:
  secret: smartchainPlatformSecretKeyForJwtTokenGenerationMustBe256BitsLongNiceDay
  access-token-validity: 3600000      # 1시간 (밀리초)
  refresh-token-validity: 604800000   # 7일 (밀리초)

# 로깅 설정
logging:
  level:
    com.smartchain.platform: DEBUG
    org.hibernate.SQL: DEBUG

# 파일 저장소 설정 (로컬)
file:
  storage:
    local:
      base-path: ./uploads

# AI Run API 설정
ai:
  run-api:
    url: http://localhost:8000
    timeout-seconds: 180
    max-retry: 3
  slots:
    domains:
      safety:
        - name: safety.tbm
          keywords: [tbm, 작업전, 안전점검, 안전회의, toolbox, 작업전회의]
          required: true
        - name: safety.education.status
          keywords: [교육, education, 이수, 안전교육, 교육이수, 수료]
          required: true
        - name: safety.fire.inspection
          keywords: [소방, fire, 점검, 소방점검, 소화기, 방화]
          required: true
        - name: safety.site.photos
          keywords: [사진, photo, 현장, 현장사진, site, image]
          required: true
      compliance:
        - name: compliance.contract.sample
          keywords: [계약, contract, 계약서, 샘플, 표준계약, 도급계약]
          required: true
        - name: compliance.contract.status
          keywords: [계약현황, 현황, status, 계약목록]
          required: true
        - name: compliance.privacy.policy
          keywords: [개인정보, privacy, 정책, 보호, 개인정보처리]
          required: true
        - name: compliance.education.status
          keywords: [교육, education, 이수, 법정교육, 컴플라이언스교육]
          required: true
      esg:
        - name: esg.energy.usage
          keywords: [에너지, energy, 사용량, 전력, 가스, 에너지사용]
          required: true
        - name: esg.energy.bill
          keywords: [고지서, bill, 근거, 요금, 청구서, 납부]
          required: true
        - name: esg.hazmat.msds
          keywords: [msds, 화학, 물질안전, 유해물질, 화학물질, hazmat]
          required: true
        - name: esg.ethics.code
          keywords: [윤리, ethics, 강령, 윤리강령, 행동강령, code of conduct]
          required: true

---
# ========================================
# 개발 서버 환경 (Azure)
# ========================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Azure Blob Storage 설정
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: ${AZURE_STORAGE_CONTAINER:smartchain-files}

logging:
  level:
    com.smartchain.platform: INFO
