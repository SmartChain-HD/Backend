name: Build and Deploy Backend

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 올라오면 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image
        run: |
          az acr login --name crsmartchain10
          # 현재 폴더(.)에 Dockerfile이 있는 경우입니다.
          docker build -t crsmartchain10.azurecr.io/sc-backend:${{ github.sha }} .
          docker push crsmartchain10.azurecr.io/sc-backend:${{ github.sha }}

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: sc-backend
          resourceGroup: rg-smartchain-prod
          imageToDeploy: crsmartchain10.azurecr.io/sc-backend:${{ github.sha }}
          environmentVariables: >
            AI_SAFETY_URL=${{ secrets.AI_SAFETY_URL }}
            AI_ESG_URL=${{ secrets.AI_ESG_URL }}
            AI_COMPLIANCE_URL=${{ secrets.AI_COMPLIANCE_URL }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            RESTART_NONCE=${{ github.sha }}